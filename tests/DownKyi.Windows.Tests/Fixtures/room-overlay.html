<!doctype html>
<meta charset="utf-8">
<style>
    html, body { margin: 0; }
    .bpx-player-container { width: 100vw; height: 100vh; position: relative; }
    .bpx-player-video-area, video { width: 100%; height: 100%; }
    .bpx-player-control-wrap { position: absolute; bottom: 0; width: 100%; height: 64px; }
    .bpx-player-progress-wrap { position: absolute; top: 0; width: 100%; height: 8px; }
    .bpx-player-ctrl-play { position: absolute; bottom: 0; left: 10px; width: 30px; height: 30px; }
</style>
<div id="mount"><div class="bpx-player-container"><div class="bpx-player-video-area"><video></video>
    <div class="bpx-player-control-wrap"><div class="bpx-player-progress-wrap"></div>
        <button class="bpx-player-ctrl-play">Pause</button></div>
</div></div></div><pre id="result">RUNNING</pre>
<script>
    const check = (condition, message) => { if (!condition) throw Error(message); };
    const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
    const waitFor = async (condition, message) => {
        for (let attempt = 0; attempt < 80; attempt++) {
            if (condition()) return;
            await delay(50);
        }
        throw Error(message);
    };
    const rows = () => [...document.querySelectorAll('.bc-action-toast')];
    const visible = node => {
        const rect = node.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0 || rect.left < 0 || rect.right > innerWidth) return false;
        for (let current = node; current; current = current.parentElement) {
            const style = getComputedStyle(current);
            if (style.display === 'none' || style.visibility !== 'visible' || Number(style.opacity) <= 0) return false;
        }
        return true;
    };
    const renderEmpty = () => { /* EMPTY_OVERLAY */ };
    const renderPause = () => { /* PAUSE_OVERLAY */ };
    const renderSeek = () => { /* SEEK_OVERLAY */ };
    const renderFullscreen = () => { /* FULLSCREEN_OVERLAY */ };
    const renderChat = () => { /* CHAT_TOAST */ };
    const observeRenderTimers = render => {
        const nativeSetTimeout = window.setTimeout;
        const nativeClearTimeout = window.clearTimeout;
        const scheduled = [];
        const cleared = [];
        window.setTimeout = function(callback, milliseconds, ...args) {
            let complete;
            const timer = { milliseconds, fired: false,
                completed: new Promise(resolve => { complete = resolve; }) };
            const observed = typeof callback === 'function' ? function(...callbackArgs) {
                timer.fired = true;
                try { return callback.apply(this, callbackArgs); }
                finally { complete(); }
            } : callback;
            timer.handle = nativeSetTimeout.call(window, observed, milliseconds, ...args);
            scheduled.push(timer);
            return timer.handle;
        };
        window.clearTimeout = function(handle) {
            cleared.push(handle);
            return nativeClearTimeout.call(window, handle);
        };
        try { render(); }
        finally {
            window.setTimeout = nativeSetTimeout;
            window.clearTimeout = nativeClearTimeout;
        }
        return { scheduled, cleared };
    };
    (async () => {
        /* PLAYER_SCRIPT */
        await waitFor(() => window.__biliCinemaLayoutReady, 'Player did not mount');
        renderEmpty();
        const original = document.querySelector('#bc-room-chat');
        renderPause();
        check(rows().length === 1 && rows()[0].textContent === '房主暂停了播放', 'Pause notice missing');
        check(visible(rows()[0]), 'Windowed notice invisible');
        await delay(250);
        renderSeek();
        check(document.querySelector('#bc-room-chat') === original, 'Overlay was unnecessarily rebuilt');
        check(rows().length === 2 && rows()[1].textContent === '房主跳转到 00:20:00', 'Seek replaced previous notice');
        window.__biliCinemaFocusPlayer();
        await waitFor(() => rows().length === 1, 'First notice did not expire independently');
        check(rows()[0].textContent === '房主跳转到 00:20:00' && visible(rows()[0]), 'Later notice lost after player repair');
        await waitFor(() => rows().length === 0, 'Second notice did not expire');
        renderFullscreen();
        check(original.classList.contains('bc-fullscreen'), 'Fullscreen overlay not active');
        check(rows().length === 3 && rows().every(visible), 'Fullscreen consecutive notices missing');
        check(rows()[1].getBoundingClientRect().top > rows()[0].getBoundingClientRect().bottom,
            'Consecutive notices did not stack on separate lines');
        await waitFor(() => rows().length === 0, 'Fullscreen notices did not expire');
        // Observe the real expiry owner rather than assuming a delayed test
        // continuation ran before five seconds elapsed under CI scheduling.
        const firstChat = observeRenderTimers(renderChat);
        const expiry = firstChat.scheduled.find(timer => timer.handle === window.__biliCinemaChatUi.toastTimer);
        check(expiry?.milliseconds === 5000, 'Chat toast did not request a five-second expiry');
        const toast = document.querySelector('.bc-toast');
        await waitFor(() => visible(toast), 'Chat toast did not appear');
        check(visible(toast) && toast.querySelector('.bc-toast-name').textContent === '观众三'
            && toast.querySelector('.bc-toast-body').textContent === '<b>一起看电影</b>'
            && !toast.querySelector('b'), 'Chat toast lost nickname, content or plain-text rendering');
        check(toast.getBoundingClientRect().left > innerWidth / 2, 'Chat toast was not on the right');
        let hiddenBeforeExpiry = false;
        const toastVisibility = new MutationObserver(() => {
            if (!toast.classList.contains('bc-visible') && !expiry.fired) hiddenBeforeExpiry = true;
        });
        toastVisibility.observe(toast, { attributes: true, attributeFilter: ['class'] });
        const repeatedChat = observeRenderTimers(renderChat);
        check(window.__biliCinemaChatUi.toastTimer === expiry.handle
            && !repeatedChat.cleared.includes(expiry.handle), 'Same-message redraw replaced or cancelled chat expiry');
        await expiry.completed;
        toastVisibility.disconnect();
        check(!hiddenBeforeExpiry, 'Chat toast disappeared before its expiry callback');
        check(expiry.fired && !toast.classList.contains('bc-visible'), 'Chat toast remained visible after its expiry callback');
        // A new video replaces the player subtree; the first event on its new overlay must also render.
        const oldPlayer = window.__biliCinemaPlayerRoot;
        const next = oldPlayer.cloneNode(true);
        next.querySelector('#bc-room-chat').remove();
        oldPlayer.replaceWith(next);
        window.__biliCinemaFocusPlayer();
        renderFullscreen();
        check(document.querySelector('#bc-room-chat') !== original && rows().length === 3
            && rows().every(visible), 'First notices after player replacement missing');
        document.querySelector('#result').textContent = 'PASS';
    })().catch(error => { document.querySelector('#result').textContent = `FAIL: ${error.message}`; });
</script>
