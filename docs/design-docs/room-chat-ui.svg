<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1010" viewBox="0 0 1680 1010">
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fbfd"/><stop offset="1" stop-color="#edf2f7"/></linearGradient>
 <linearGradient id="cinema" x2="0" y2="1"><stop stop-color="#345365"/><stop offset=".55" stop-color="#a9bec2"/><stop offset=".56" stop-color="#657e68"/><stop offset="1" stop-color="#263c36"/></linearGradient>
 <linearGradient id="overlay" x2="0" y2="1"><stop stop-color="#101820" stop-opacity=".84"/><stop offset="1" stop-color="#101820" stop-opacity=".68"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#213143" flood-opacity=".13"/></filter>
 <pattern id="grain" width="120" height="100" patternUnits="userSpaceOnUse"><circle cx="16" cy="13" r="1" fill="#fff" opacity=".14"/><circle cx="78" cy="51" r="1.4" fill="#fff" opacity=".12"/><circle cx="45" cy="88" r="1" fill="#fff" opacity=".16"/></pattern>
</defs>
<rect width="1680" height="1010" fill="url(#bg)"/>
<text x="64" y="58" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#1f3448">BiliCinema · 房间聊天 UI 定稿</text>
<text x="64" y="91" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="15" fill="#6b7e90">房间内轻量沟通 · 聊天只在全屏悬停时展开</text>
<!-- LEFT CARD -->
<g filter="url(#shadow)"><rect x="54" y="122" width="765" height="818" rx="18" fill="#fff"/></g>
<text x="82" y="164" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" fill="#20364a">房间常态</text>
<text x="82" y="188" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="13" fill="#8292a2">解析、播放与房间控制集中在一个页面</text>
<rect x="76" y="209" width="721" height="378" rx="12" fill="#080d12"/>
<rect x="91" y="224" width="691" height="346" rx="4" fill="url(#cinema)"/>
<rect x="91" y="224" width="691" height="346" rx="4" fill="url(#grain)"/>
<!-- scenic silhouette -->
<circle cx="636" cy="297" r="41" fill="#e8dcae" opacity=".72"/>
<path d="M91 469 Q172 414 247 447 T402 424 T557 458 T782 416 V570 H91Z" fill="#425c50"/>
<path d="M91 493 Q206 452 313 480 T523 465 T782 490 V570 H91Z" fill="#30463d"/>
<path d="M370 570 L434 434 L487 570Z" fill="#273d37"/>
<path d="M402 570 L450 468 L500 570Z" fill="#192d2b"/>
<text x="118" y="548" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12" fill="#eaf0ed" opacity=".8">影片画面示意</text>
<rect x="91" y="558" width="691" height="4" rx="2" fill="#ffffff" opacity=".35"/><rect x="91" y="558" width="257" height="4" rx="2" fill="#1688e8"/>
<text x="82" y="622" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="15" fill="#60768a">当前房间人数：2 人</text>
<rect x="76" y="646" width="721" height="100" rx="12" fill="#f4f7fa"/>
<text x="96" y="676" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="13" font-weight="600" fill="#344b60">房间昵称</text>
<rect x="96" y="690" width="337" height="40" rx="9" fill="#fff" stroke="#cdd8e2"/>
<text x="110" y="716" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#263c50">阿澈</text>
<rect x="445" y="690" width="100" height="40" rx="9" fill="#eaf3fc" stroke="#b8d9f5"/>
<text x="468" y="716" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="13" font-weight="600" fill="#0877d1">保存昵称</text>
<text x="562" y="714" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12" fill="#8493a1">房间内其他人会看到此昵称</text>
<rect x="76" y="761" width="721" height="52" rx="11" fill="#f7f9fb" stroke="#e2e8ee"/>
<text x="95" y="793" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="13" fill="#718395">房间服务</text>
<text x="183" y="793" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="13" fill="#32495e">wss://cinema.example/ws</text>
<rect x="76" y="828" width="721" height="1" fill="#edf1f4"/>
<text x="82" y="861" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="13" fill="#7a8a98">全屏时将鼠标移至右侧边缘，即可呼出聊天面板。</text>
<text x="82" y="900" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12" fill="#9aa7b2">消息仅用于本房间交流；退出房间后不再显示。</text>
<!-- RIGHT CARD -->
<g filter="url(#shadow)"><rect x="861" y="122" width="765" height="818" rx="18" fill="#fff"/></g>
<text x="889" y="164" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" fill="#20364a">全屏 · 鼠标悬停右侧</text>
<text x="889" y="188" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="13" fill="#8292a2">面板半透明叠在画面上，收窄宽度以保留观影空间</text>
<rect x="883" y="209" width="721" height="604" rx="12" fill="#080d12"/>
<rect x="898" y="224" width="691" height="574" rx="4" fill="url(#cinema)"/>
<rect x="898" y="224" width="691" height="574" rx="4" fill="url(#grain)"/>
<circle cx="1398" cy="301" r="59" fill="#e8dcae" opacity=".72"/>
<path d="M898 627 Q1022 541 1123 596 T1337 548 T1589 586 V798 H898Z" fill="#425c50"/>
<path d="M898 674 Q1022 608 1161 641 T1388 606 T1589 642 V798 H898Z" fill="#30463d"/>
<path d="M1169 798 L1267 541 L1360 798Z" fill="#273d37"/><path d="M1200 798 L1284 601 L1371 798Z" fill="#192d2b"/>
<text x="928" y="765" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12" fill="#eaf0ed" opacity=".82">画面与原播放器控制仍可见</text>
<!-- chat overlay -->
<rect x="1328" y="224" width="261" height="574" rx="4" fill="url(#overlay)"/>
<rect x="1328" y="224" width="261" height="574" fill="#0f1b25" opacity=".08"/>
<text x="1348" y="258" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="15" font-weight="700" fill="#fff">房间聊天</text>
<circle cx="1559" cy="250" r="4" fill="#52d39b"/><text x="1530" y="273" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="10" fill="#c1ced8">2 人</text>
<line x1="1344" y1="287" x2="1573" y2="287" stroke="#fff" stroke-opacity=".17"/>
<!-- msg1 -->
<circle cx="1358" cy="316" r="12" fill="#4594db"/><text x="1354" y="320" font-family="Segoe UI,sans-serif" font-size="9" font-weight="700" fill="#fff">澈</text>
<text x="1378" y="313" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="11" font-weight="700" fill="#a9d6ff">阿澈</text><text x="1540" y="313" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="9" fill="#b8c3cc">21:08</text>
<text x="1378" y="334" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12" fill="#f5f7f9">这个镜头拍得真好。</text>
<!-- msg2 -->
<circle cx="1358" cy="371" r="12" fill="#a073db"/><text x="1354" y="375" font-family="Segoe UI,sans-serif" font-size="9" font-weight="700" fill="#fff">林</text>
<text x="1378" y="368" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="11" font-weight="700" fill="#d3baff">林间月</text><text x="1540" y="368" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="9" fill="#b8c3cc">21:08</text>
<text x="1378" y="389" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12" fill="#f5f7f9">是啊，配乐也很有氛围。</text>
<!-- msg3 -->
<circle cx="1358" cy="426" r="12" fill="#4594db"/><text x="1354" y="430" font-family="Segoe UI,sans-serif" font-size="9" font-weight="700" fill="#fff">澈</text>
<text x="1378" y="423" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="11" font-weight="700" fill="#a9d6ff">阿澈</text><text x="1540" y="423" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="9" fill="#b8c3cc">21:09</text>
<text x="1378" y="444" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12" fill="#f5f7f9">等下这段一起暂停聊聊？</text>
<rect x="1347" y="716" width="223" height="41" rx="10" fill="#fff" fill-opacity=".13" stroke="#fff" stroke-opacity=".29"/>
<text x="1361" y="742" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12" fill="#c8d1d9">说点什么…</text>
<rect x="1497" y="765" width="73" height="28" rx="8" fill="#1688e8"/>
<text x="1518" y="784" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="11" font-weight="700" fill="#fff">发送</text>
<!-- cursor hint -->
<path d="M1575 501 L1575 527 L1581 520 L1588 532 L1593 529 L1586 517 L1595 515Z" fill="#fff" stroke="#1d2a35" stroke-width="1.3"/>
<text x="889" y="850" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12" fill="#768899">交互：移入右侧边缘展开 · 移出后延迟收起 · 输入框聚焦时保持展开</text>
<text x="889" y="879" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12" fill="#768899">Enter 发送 · Shift+Enter 换行 · Esc 退出全屏</text>
<rect x="889" y="900" width="6" height="6" rx="3" fill="#1688e8"/>
<text x="905" y="907" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="11" fill="#8b99a6">视觉说明：BiliCinema 蓝色强调色，深色半透明聊天层，消息与时间分层。</text>
</svg>
