name: Android verification

on:
  pull_request:
    paths: ['android/**', 'version.txt', 'script/build-android.ps1', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', 'version.txt', 'script/build-android.ps1', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Player behavior tests
        run: node --test android/tests/player.test.mjs
      - name: Unit tests, lint and debug package
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-verification
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
