name: BiliCinema Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - version.txt
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: bilicinema-release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  verify-package:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ./DownKyi.sln
      - name: Strict build
        run: >
          dotnet build ./DownKyi.sln -c Release --no-restore --no-incremental
          -p:EnableNETAnalyzers=true -p:AnalysisMode=All -p:EnforceCodeStyleInBuild=true
          -p:TreatWarningsAsErrors=true -p:CodeAnalysisTreatWarningsAsErrors=true
          -p:UseSharedCompilation=false
      - name: Verify formatting
        shell: pwsh
        run: ./script/verify-format.ps1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Cloud room router regression
        working-directory: cloud
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
      - name: Full Windows regression
        timeout-minutes: 10
        shell: pwsh
        run: ./script/test-solution.ps1 -Configuration Release -NoRestore -NoBuild
      - name: Package audit
        shell: pwsh
        run: |
          dotnet package list --project ./DownKyi.sln --vulnerable --include-transitive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet package list --project ./DownKyi.sln --deprecated --include-transitive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore Windows runtime and build single executable
        shell: pwsh
        run: ./script/build-bilicinema.ps1
      - name: Verify packaged aria2 security
        shell: pwsh
        env:
          DOWNKYI_ARIA2_BINARY: ${{ github.workspace }}/DownKyi.Core/Binary/win-x64/aria2/aria2c.exe
          DOWNKYI_ARIA2_RID: win-x64
          DOWNKYI_ARIA2_TLS_REPORT: ${{ github.workspace }}/artifacts/aria2-tls/win-x64
        run: ./script/test-project.ps1 -ProjectPath ./tests/DownKyi.Tests/DownKyi.Tests.csproj -Configuration Release -NoRestore -NoBuild -ClassName DownKyi.Tests.Aria2TlsIntegrationTests
      - name: Record executable checksum
        shell: pwsh
        run: |
          $folder = 'artifacts/BiliCinema-win-x64'
          $digest = (Get-FileHash "$folder/BiliCinema.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  BiliCinema.exe" | Set-Content "$folder/SHA256SUMS.txt" -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: BiliCinema-win-x64
          path: artifacts/BiliCinema-win-x64/
          if-no-files-found: error
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-evidence
          path: |
            artifacts/test-results/
            artifacts/test-flight-recorder/
            artifacts/aria2-tls/
          if-no-files-found: ignore

  android-package:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Restore Android release signing identity
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) {
            throw 'Configure the existing Android signing identity before publishing. Never generate a new CI release key.'
          }
          $keyFile = Join-Path $env:RUNNER_TEMP 'bilicinema-release.jks'
          [IO.File]::WriteAllBytes($keyFile, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "BILICINEMA_KEYSTORE=$keyFile" >> $env:GITHUB_ENV
      - name: Test, lint and package signed APK
        shell: pwsh
        env:
          BILICINEMA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BILICINEMA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BILICINEMA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./script/build-android.ps1
      - name: Remove temporary signing key
        if: always()
        shell: pwsh
        run: |
          $keyFile = Join-Path $env:RUNNER_TEMP 'bilicinema-release.jks'
          if (Test-Path -LiteralPath $keyFile) { Remove-Item -LiteralPath $keyFile -Force }
      - uses: actions/upload-artifact@v7
        with:
          name: BiliCinema-android
          path: artifacts/BiliCinema-android/
          if-no-files-found: error
      - name: Upload Android verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-evidence
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore

  codeql:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
      - run: dotnet build ./DownKyi.sln -c Release --no-incremental
      - uses: github/codeql-action/analyze@v4

  codeql-android-cloud:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin,javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  publish:
    needs: [verify-package, android-package, codeql, codeql-android-cloud]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: BiliCinema-win-x64
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: BiliCinema-android
          path: android-assets
      - name: Combine verified release packages
        shell: bash
        run: |
          set -euo pipefail
          cp android-assets/*.apk release-assets/
          cat android-assets/SHA256SUMS.txt >> release-assets/SHA256SUMS.txt
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
      - name: Publish verified executable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < version.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="bilicinema-v${version}"
          existing_tag="$(git ls-remote --tags origin "refs/tags/$tag")"
          if [[ -n "$existing_tag" ]]; then
            echo 'This tag already exists. Use a new version; tags will not be reused.' >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'This version already has a release. Existing assets will not be replaced.' >&2
            exit 1
          fi
          gh release create "$tag" release-assets/BiliCinema.exe release-assets/*.apk release-assets/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "BiliCinema v${version}" \
            --notes-file docs/releases/bilicinema.md --latest
